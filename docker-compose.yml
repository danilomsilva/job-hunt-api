# Local development database. Not used in production.
#
#   docker compose up -d       start Postgres in the background
#   docker compose down        stop it, keep the data
#   docker compose down -v     stop it and wipe the data volume

services:
  postgres:
    image: postgres:16-alpine
    container_name: job-hunt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_hunt
    ports:
      - '5432:5432'
    volumes:
      - job-hunt-pgdata:/var/lib/postgresql/data
      # Runs once, only when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d job_hunt']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  job-hunt-pgdata:
